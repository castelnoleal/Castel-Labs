<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EDM Forge — AI Music Generator</title><style>
:root{--bg:#08090d;--panel:#11131a;--panel2:#171a23;--text:#f7f8fc;--muted:#9298aa;--line:#272b38;--accent:#8b5cf6;--accent2:#22d3ee;--good:#34d399}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#21113f 0,transparent 35%),radial-gradient(circle at 90% 10%,#07384a 0,transparent 30%),var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}.app{max-width:1450px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{font-size:20px;font-weight:800;letter-spacing:-.5px}.brand span{color:var(--accent2)}.status{font-size:12px;color:var(--good);background:#0b211b;padding:7px 10px;border-radius:999px}.grid{display:grid;grid-template-columns:330px 1fr 300px;gap:16px}.panel{background:rgba(17,19,26,.88);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 18px 50px #0005;backdrop-filter:blur(16px)}h2{font-size:16px;margin:0 0 14px}label{display:block;color:var(--muted);font-size:12px;margin:13px 0 6px}select,input,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px;outline:none}textarea{min-height:88px;resize:vertical}.row{display:flex;gap:8px}.row>*{flex:1}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}.chip{border:1px solid #353a4b;background:#1b1e29;border-radius:999px;padding:7px 9px;font-size:12px}.chip.active{border-color:var(--accent);background:#28174a}.primary{width:100%;border:0;border-radius:11px;padding:13px;margin-top:15px;background:linear-gradient(135deg,var(--accent),#5b7cfa);font-weight:800}.secondary{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:9px 12px}.hero{min-height:500px;display:flex;flex-direction:column}.trackhead{display:flex;justify-content:space-between;gap:10px;align-items:center}.tracktitle{font-size:24px;font-weight:800}.meta{color:var(--muted);font-size:12px;margin-top:4px}.player{margin-top:24px;padding:16px;border:1px solid var(--line);border-radius:14px;background:#0d0f15}.playrow{display:flex;align-items:center;gap:12px}.play{width:46px;height:46px;border-radius:50%;border:0;background:var(--text);color:#0b0c10;font-weight:900}.wave{height:95px;display:flex;align-items:center;gap:3px;margin:15px 0}.bar{flex:1;border-radius:5px;background:linear-gradient(to top,var(--accent),var(--accent2));opacity:.75}.timeline{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:16px}.section{padding:12px;border:1px solid var(--line);border-radius:10px;background:#12151d;cursor:pointer}.section.sel{border-color:var(--accent2);box-shadow:0 0 0 1px #22d3ee44}.section b{display:block}.section small{color:var(--muted)}.modify{margin-top:auto;padding-top:20px}.taginput{display:flex;gap:8px}.taginput input{flex:1}.taginput button{border:0;background:var(--accent);border-radius:10px;padding:0 15px;font-weight:700}.history{display:flex;flex-direction:column;gap:8px}.ver{padding:10px;border:1px solid var(--line);border-radius:10px;background:#12151d}.ver.active{border-color:var(--accent)}.ver small{color:var(--muted);display:block;margin-top:3px}.log{margin-top:12px;color:var(--muted);font-size:12px;min-height:20px}.mobileOnly{display:none}@media(max-width:1050px){.grid{grid-template-columns:280px 1fr}.right{grid-column:1/-1}.history{display:grid;grid-template-columns:repeat(4,1fr)}}@media(max-width:720px){.app{padding:10px}.grid{display:flex;flex-direction:column}.panel{border-radius:14px;padding:14px}.hero{min-height:480px}.timeline{grid-template-columns:repeat(2,1fr)}.history{grid-template-columns:1fr 1fr}.top{align-items:flex-start}.status{font-size:10px}.tracktitle{font-size:20px}.wave{height:70px}.right{order:3}.left{order:1}.hero{order:2}}
</style></head><body><div class="app"><header class="top"><div class="brand">EDM <span>FORGE</span></div><div class="status">● Prototype engine online</div></header><main class="grid"><section class="panel left"><h2>🎚 Create Track</h2><label>Genre</label><select id="genre"><option>Future Bass</option><option>Melodic Dubstep</option><option>Progressive House</option><option>Big Room</option><option>Tech House</option><option>Drum & Bass</option><option>Hardstyle</option><option>Trance</option><option>Synthwave</option><option>Phonk</option><option>Trap</option><option>Hyperpop</option></select><div class="row"><div><label>BPM</label><input id="bpm" type="number" value="150" min="60" max="220"></div><div><label>Key</label><select id="key"><option>F# Minor</option><option>C Minor</option><option>A Minor</option><option>D Minor</option><option>E Minor</option><option>G Major</option></select></div></div><label>Energy <span id="energyVal">85%</span></label><input id="energy" type="range" min="0" max="100" value="85"><label>Mood</label><select id="mood"><option>Euphoric</option><option>Dark</option><option>Emotional</option><option>Aggressive</option><option>Chill</option><option>Futuristic</option></select><label>Sound direction</label><textarea id="desc" placeholder="Emotional festival anthem with a massive cinematic drop..."></textarea><label>Quick tags</label><div class="chips" id="chips"></div><button class="primary" id="generate">✨ Generate Track</button></section><section class="panel hero"><div class="trackhead"><div><div class="tracktitle" id="title">Untitled EDM Track</div><div class="meta" id="meta">Future Bass • 150 BPM • F# Minor • Euphoric</div></div><button class="secondary" id="new">＋ New</button></div><div class="player"><div class="playrow"><button class="play" id="play">▶</button><div style="flex:1"><div id="time">00:00 / 02:30</div><input type="range" id="progress" min="0" max="150" value="0"></div><button class="secondary" id="download">Export</button></div><div class="wave" id="wave"></div><div class="timeline" id="timeline"></div></div><div class="modify"><h2>✨ Improve this track</h2><div class="taginput"><input id="modify" placeholder="#biggerdrop #morebass or describe a change..."><button id="apply">Improve</button></div><div class="log" id="log">Select a section, then add tags or a short description.</div></div></section><aside class="panel right"><h2>🕘 Version History</h2><div class="history" id="history"></div><h2 style="margin-top:20px">🏷 Active Tags</h2><div class="chips" id="active"></div></aside></main></div><script>
const quick=['#biggerdrop','#morebass','#darker','#euphoric','#vocalchops','#hardkick','#wider','#cinematic','#shortbreakdown','#distortedbass'];let tags=[],versions=[];let selected='Drop 1';let playing=false,seconds=0;const $=id=>document.getElementById(id);quick.forEach(t=>{let b=document.createElement('button');b.className='chip';b.textContent=t;b.onclick=()=>{b.classList.toggle('active');if(b.classList.contains('active'))addTag(t)};$('chips').appendChild(b)});function addTag(t){if(!tags.includes(t))tags.push(t);renderTags()}function renderTags(){$('active').innerHTML=tags.map(t=>`<span class="chip active">${t}</span>`).join('')}function renderWave(){let h='';for(let i=0;i<72;i++){let v=15+Math.abs(Math.sin(i*.63))*55+Math.random()*25;h+=`<i class="bar" style="height:${v}%"></i>`}$('wave').innerHTML=h}function renderTimeline(){$('timeline').innerHTML=['Intro','Build','Drop 1','Breakdown','Drop 2'].map(x=>`<div class="section ${x===selected?'sel':''}" onclick="selectSection('${x}')"><b>${x}</b><small>${x.includes('Drop')?'High energy':'Arrangement'}</small></div>`).join('')}window.selectSection=x=>{selected=x;renderTimeline();$('log').textContent=`Editing ${x}. Changes will target this section.`};function meta(){return `${$('genre').value} • ${$('bpm').value} BPM • ${$('key').value} • ${$('mood').value}`}function generate(reason='Original generation'){let title=$('genre').value+' — '+$('mood').value+' Pulse';$('title').textContent=title;$('meta').textContent=meta();versions.unshift({n:versions.length+1,reason});renderHistory();renderWave();renderTimeline();$('log').textContent=reason+' created. Ready for your next improvement.'}function renderHistory(){$('history').innerHTML=versions.slice(0,8).map((v,i)=>`<div class="ver ${i===0?'active':''}"><b>V${v.n} ${i===0?'• Current':''}</b><small>${v.reason}</small></div>`).join('')}function apply(){let text=$('modify').value.trim();if(!text)return;let found=text.match(/#[\w-]+/g)||[];found.forEach(addTag);versions.unshift({n:versions.length+1,reason:`${selected}: ${text}`});renderHistory();$('log').textContent=`Improvement queued for ${selected}: ${text}`;$('modify').value=''}$('energy').oninput=e=>$('energyVal').textContent=e.target.value+'%';$('generate').onclick=()=>generate('Generated from '+$('genre').value);$('apply').onclick=apply;$('modify').addEventListener('keydown',e=>{if(e.key==='Enter')apply()});$('new').onclick=()=>{versions=[];tags=[];renderTags();$('title').textContent='Untitled EDM Track';$('meta').textContent=meta();$('history').innerHTML='';$('log').textContent='New project ready.'};$('progress').oninput=e=>{seconds=+e.target.value;$('time').textContent=`${fmt(seconds)} / 02:30`};function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0')}$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'❚❚':'▶'};setInterval(()=>{if(playing){seconds=Math.min(150,seconds+1);$('progress').value=seconds;$('time').textContent=`${fmt(seconds)} / 02:30`;if(seconds>=150)playing=false}},1000);$('download').onclick=()=>alert('Export is prepared for the audio engine integration. The current build stores the project state and musical instructions; connect an audio-generation provider to render WAV/MP3.');generate('Starter project');
</script></body></html>
